<!DOCTYPE html>
<html lang="en">
<body>
    <form action="http://localhost:5000/formlogin" method="GET">
        {% if error %}
        <p><strong>{{error}}</strong></p>
        {% endif %}
        <table>
            <tr><td>Name</td>
            <td><input type="text" name="uname"></td></tr>
            <tr><td>Password</td>
            <td><input type="password" name="pass"></td></tr>
            <tr><td><input type="submit"></td></tr>
        </table>
    </form>
</body>
</html>
